name: Build Resourcepack

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Create resourcepack zip
      run: |
        zip -r Aether-resourcepack.zip . -x ".git/*" ".github/*" ".*" "*.md" ".gitignore"

    - name: Get current date and time
      id: date
      run: |
        echo "datetime=$(date +'%Y.%m.%d-%H.%M.%S')" >> $GITHUB_OUTPUT

    - name: Delete old 'auto' release if exists
      uses: dev-drprasad/delete-tag-and-release@v1.1
      with:
        tag_name: auto
        delete_release: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: Create new release 'auto'
      uses: softprops/action-gh-release@v2
      with:
        files: Aether-resourcepack.zip
        tag_name: "auto"
        name: "Aether Resourcepack - ${{ steps.date.outputs.datetime }}"
        body: |
          **Автоматическая сборка ресурспака**
          
          🕐 Время сборки: ${{ steps.date.outputs.datetime }}
          
          📦 **Что внутри:**
          - Полный ресурспак Aether
          
          🔄 Этот релиз автоматически обновляется при каждом пуше в main
        draft: false
        prerelease: false
        make_latest: "legacy"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
