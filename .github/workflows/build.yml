name: Build Resourcepack

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Create resourcepack zip
      run: |
        zip -r ShadowBlade-resourcepack.zip . -x ".git/*" ".github/*" ".*" "*.md"

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: ShadowBlade-resourcepack.zip
        tag_name: "v1.0.0"
        name: "ShadowBlade Resourcepack v1.0.0"
        body: "Автоматическая сборка ресурспака"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
